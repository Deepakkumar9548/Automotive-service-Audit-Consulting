<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Corporate Deep Navy Background with subtle gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A36" />
      <stop offset="100%" stop-color="#051226" />
    </linearGradient>

    <!-- Vibrant Gold Gradient for Car & Checkmark -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B842" />
      <stop offset="50%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#B37812" />
    </linearGradient>
  </defs>

  <!-- Rounded Premium Container -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>

  <!-- Subtle Gold Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#D99B26" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Sleek Speed Car Silhouette on Top -->
  <path d="M 16 22 C 24 14, 40 12, 50 18 C 45 16, 32 15, 23 20 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 12 23 C 18 19, 30 18, 46 22 C 40 21, 26 20, 16 23 Z" fill="url(#favGold)" />

  <!-- Bold ASAC Text -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, Arial, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ASAC
  </text>

  <!-- Distinct Golden Verification Accent Tick under 'A' -->
  <path d="M 14 38 L 19 44 L 28 32 C 24 35, 19 39, 17 41 Z" fill="url(#favGold)" />

  <!-- Rising Bar Indicator on top right corner of ASAC -->
  <rect x="47" y="27" width="2" height="4" rx="0.5" fill="url(#favGold)" />
  <rect x="50" y="25" width="2" height="6" rx="0.5" fill="url(#favGold)" />
  <rect x="53" y="23" width="2" height="8" rx="0.5" fill="url(#favGold)" />

  <!-- Bottom Gold Accent Divider -->
  <line x1="14" y1="51" x2="50" y2="51" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round" />
</svg>
