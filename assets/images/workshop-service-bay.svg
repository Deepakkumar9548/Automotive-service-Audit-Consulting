<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ws" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1329"/>
    </linearGradient>
    <linearGradient id="floor_ws" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB75A"/>
      <stop offset="100%" stop-color="#C89D3C"/>
    </linearGradient>
    <linearGradient id="blue_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_ws" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="320" fill="url(#bg_ws)"/>
  
  <!-- Architectural Bay Pillars & Lighting -->
  <g stroke="#334155" stroke-width="2" opacity="0.6">
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
  </g>
  <!-- Overhead LED Strip Fixtures -->
  <rect x="80" y="20" width="160" height="8" rx="4" fill="#E2E8F0" filter="url(#shadow_ws)"/>
  <polygon points="60,28 260,28 300,180 20,180" fill="url(#blue_glow)"/>
  <rect x="360" y="20" width="160" height="8" rx="4" fill="#E2E8F0" filter="url(#shadow_ws)"/>
  <polygon points="340,28 540,28 580,180 300,180" fill="url(#blue_glow)"/>
  <rect x="640" y="20" width="120" height="8" rx="4" fill="#E2E8F0" filter="url(#shadow_ws)"/>

  <!-- Floor with Epoxy Markings -->
  <polygon points="0,320 800,320 800,500 0,500" fill="url(#floor_ws)"/>
  <!-- Safety Yellow Lane Markings -->
  <polygon points="0,320 800,320 800,330 0,330" fill="url(#gold_grad)"/>
  <line x1="260" y1="330" x2="220" y2="500" stroke="#DFB75A" stroke-width="4" stroke-dasharray="15,10"/>
  <line x1="540" y1="330" x2="580" y2="500" stroke="#DFB75A" stroke-width="4" stroke-dasharray="15,10"/>

  <!-- Bay Signage -->
  <g transform="translate(110, 48)">
    <rect width="100" height="26" rx="4" fill="#0F172A" stroke="#C89D3C" stroke-width="1.5"/>
    <text x="50" y="17" fill="#DFB75A" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">BAY 01 ? ACTIVE</text>
  </g>
  <g transform="translate(390, 48)">
    <rect width="100" height="26" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="50" y="17" fill="#38BDF8" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">BAY 02 ? INSP</text>
  </g>

  <!-- Hydraulic Two-Post Lift (Bay 1) -->
  <rect x="60" y="110" width="20" height="240" rx="3" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="230" y="110" width="20" height="240" rx="3" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="70" y="210" width="170" height="12" rx="3" fill="#C89D3C"/>
  <!-- Car Silhouette Raised on Lift -->
  <g transform="translate(75, 150)">
    <path d="M15,45 C20,30 35,20 60,18 L95,18 C115,20 135,30 145,45 L155,50 C158,52 160,56 160,60 L160,68 C160,72 156,75 150,75 L10,75 C4,75 0,72 0,68 L0,60 C0,56 5,50 15,45 Z" fill="#2563EB" filter="url(#shadow_ws)"/>
    <path d="M35,38 L62,24 L96,24 L120,38 Z" fill="#93C5FD" opacity="0.8"/>
    <!-- Wheels on Lift Arms -->
    <rect x="18" y="65" width="24" height="15" rx="4" fill="#0F172A"/>
    <rect x="118" y="65" width="24" height="15" rx="4" fill="#0F172A"/>
  </g>

  <!-- Modern Diagnostic Car on Bay 2 -->
  <g transform="translate(340, 260)">
    <!-- Shadow -->
    <ellipse cx="130" cy="95" rx="140" ry="18" fill="#000" opacity="0.4"/>
    <!-- Vehicle Body -->
    <path d="M20,60 Q35,25 80,18 L180,18 Q220,25 240,60 L255,68 C258,72 260,78 260,84 L260,92 C260,96 256,98 250,98 L10,98 C4,98 0,96 0,92 L0,84 C0,78 5,72 20,60 Z" fill="#0B2545" stroke="#1E40AF" stroke-width="2"/>
    <path d="M45,50 L85,25 L175,25 L215,50 Z" fill="#60A5FA" opacity="0.5"/>
    <line x1="130" y1="25" x2="130" y2="50" stroke="#0B2545" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="50" cy="94" r="22" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="50" cy="94" r="10" fill="#CBD5E1"/>
    <circle cx="210" cy="94" r="22" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="210" cy="94" r="10" fill="#CBD5E1"/>
    <!-- Headlight beam -->
    <polygon points="255,68 260,80 320,105 320,55" fill="url(#blue_glow)"/>
  </g>

  <!-- Mobile Diagnostic Trolley with Monitor -->
  <g transform="translate(630, 240)" filter="url(#shadow_ws)">
    <rect x="0" y="40" width="70" height="90" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Diagnostic Screen -->
    <rect x="5" y="0" width="60" height="42" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <line x1="12" y1="12" x2="35" y2="12" stroke="#4ADE80" stroke-width="2"/>
    <line x1="12" y1="20" x2="52" y2="20" stroke="#38BDF8" stroke-width="2"/>
    <line x1="12" y1="28" x2="40" y2="28" stroke="#DFB75A" stroke-width="2"/>
    <!-- Trolley Wheels -->
    <circle cx="12" cy="136" r="6" fill="#64748B"/>
    <circle cx="58" cy="136" r="6" fill="#64748B"/>
    <!-- Diagnostic Cable to Car -->
    <path d="M-5,70 Q-40,110 -60,85" stroke="#F59E0B" stroke-width="3" fill="none" stroke-dasharray="4,2"/>
  </g>

  <!-- Workshop Floor Watermark / Audit Badge -->
  <g transform="translate(24, 436)">
    <rect width="210" height="40" rx="8" fill="#0F172A" opacity="0.9" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="20" cy="20" r="10" fill="#C89D3C"/>
    <path d="M16 20l3 3 6-6" stroke="#0B2545" stroke-width="2" fill="none"/>
    <text x="38" y="18" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">WORKSHOP FLOOR AUDIT</text>
    <text x="38" y="31" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="9.5">Bay Productivity &amp; WIP Velocity</text>
  </g>
</svg>